spring.application.name=messmate-backend
server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


jwt.secret=${JWT_SECRET}
jwt.issuer=messmate-api
jwt.expiry=900

jwt.refresh-expiry=604800

jwt.cookie.path=/
jwt.cookie.max-age=604800
jwt.cookie.http-only=true
jwt.cookie.same-site=Lax


otp.length=6
otp.expiry=5m
otp.max-attempts=5
otp.resend-cooldown=60s

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}



